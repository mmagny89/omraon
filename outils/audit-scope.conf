# outils/audit-scope.conf — la portee des audits actifs et des tests de charge de ce projet.
#
# Versionne avec le projet. Declarer un hote ici, c'est affirmer que ce service vous
# appartient et que vous acceptez qu'on l'attaque ou qu'on le charge. Un hote absent de ce
# fichier n'est jamais attaque, quel que soit le drapeau passe (audit-intrusion.sh,
# test-charge.sh). Les audits passifs (SEO, RGAA, en-tetes) n'ont pas besoin de ce fichier.
#
# Format : CLE="valeur", hotes separes par des espaces, sans schema ni port.
# Se verifie avec : .claude/scripts/audit-portee.sh --verifier actif https://hote

# Ressources des conteneurs d'audit (ZAP, nuclei, k6, Playwright). Defauts : 2 processeurs, 2 Go.
#   AUDIT_CPUS="2"
#   AUDIT_MEM="2g"
#   AUDIT_ZAP_HEAP="768m"        # tas Java de ZAP
#   AUDIT_ZAP_MEM="1536m"        # limite du conteneur ZAP (tas + marge de la JVM)
#   AUDIT_RAM_MIN_MB="3072"      # memoire libre minimale de la MACHINE pour lancer un audit

# Cibles du projet pour audit-cibles.sh : un projet headless a un front ET une API, auditer
# l'un sans l'autre en oublie la moitie. Nom=URL, separes par des espaces. Chaque URL doit etre
# couverte par HOTES_* (ou etre locale). PAGES_<nom> : pages ou routes a analyser ou charger.
# AUDITS_<nom> : audits qui visent cette cible (defaut : seo rgaa intrusion charge).
#   CIBLES="front=http://localhost:5173 api=https://localhost"
#   PAGES_front="/ /connexion"
#   PAGES_api="/api/info/rules /api/leaderboard"
#   AUDITS_api="intrusion charge"
CIBLES=""

# Machine de developpement (localhost, *.localhost et 127.0.0.1 sont toujours consideres locaux).
HOTES_LOCAL=""

# Serveur de recette : scan actif et charge autorises dans les plafonds ci-dessous.
HOTES_STAGING=""

# Production : scan actif seulement avec --prod-confirme <hote>, charge seulement si
# CHARGE_MAX_VU_PROD est superieur a 0.
HOTES_PROD=""

# Plafonds. Utilisateurs virtuels simultanes (k6), requetes par seconde pour le scan actif.
CHARGE_MAX_VU_LOCAL="50"
CHARGE_MAX_VU_STAGING="200"
CHARGE_MAX_VU_PROD="0"
SCAN_MAX_RPS_LOCAL="50"
SCAN_MAX_RPS_STAGING="10"
SCAN_MAX_RPS_PROD="2"

# Compte de test jetable pour charger une API protegee (test-charge.sh --compte-test). Local et
# staging seulement, JAMAIS en production. Les commandes sont lancees depuis la racine du projet et
# recoivent l'identite par l'environnement (AUD_COMPTE_EMAIL, AUD_COMPTE_MDP, AUD_COMPTE_PSEUDO,
# AUD_COMPTE_URL), jamais en argument. Voir references/commandes.md, section « Compte de test ».
#   COMPTE_TEST_CREER="sh outils/compte-test.sh creer"
#   COMPTE_TEST_SUPPRIMER="sh outils/compte-test.sh supprimer"
#   COMPTE_TEST_CONNEXION="/api/login json email password"   # chemin, format (json|form), champ id, champ mdp
#   COMPTE_TEST_CIBLES="api"                                  # cibles de CIBLES qui recoivent --compte-test
