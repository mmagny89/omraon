<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Système d'Omraon — Simulation</title>
  <meta name="description" content="Simulation N-corps et visualisation 3D du système d'Omraon : une étoile, trois telluriques, une ceinture, deux géantes et six lunes.">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <canvas id="view" aria-label="Vue 3D du système d'Omraon"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="top">
    <button id="btn-bodies" class="icon" aria-label="Corps célestes" aria-expanded="false">☰</button>
    <h1>Système d'<b>Omraon</b></h1>
    <div id="views" role="group" aria-label="Vues">
      <button data-view="system">Système</button>
      <button data-view="inner">Intérieur</button>
      <button data-view="kebet">Kebet</button>
    </div>
    <button id="btn-info" class="icon" aria-label="Fiche du corps" aria-expanded="false">ⓘ</button>
  </header>

  <aside id="bodies" aria-label="Corps célestes"><div id="list"></div></aside>
  <aside id="info" aria-label="Fiche du corps sélectionné"><div id="site-tools" hidden>
    <details id="sky-box" open><summary>Ciel vu d'ici</summary>
      <div class="sky-ctl"><label>Centre <select id="sky-center"><option value="star">Étoile</option><option value="parent">Planète parente</option><option value="north">Nord</option></select></label>
      <label>Champ <select id="sky-fov"><option value="360">360°</option><option value="180" selected>180°</option><option value="90">90°</option><option value="40">40°</option></select></label></div>
      <canvas id="sky" aria-label="Ciel vu du site sélectionné"></canvas><div id="sky-info"></div>
    </details>
    <details id="scene-box"><summary>Fiche de scène</summary><div id="scene-out"></div><div class="actions"><button type="button" id="scene-copy">Copier le texte</button></div></details>
  </div><details id="transfer" hidden><summary>Trajet vers un autre site</summary><select id="tr-dest" aria-label="Destination"></select><select id="tr-prop" aria-label="Propulsion"></select><label for="tr-acc" class="acc">Accélération (g, hypothèse)</label><input id="tr-acc" type="number" min="0.001" step="any" value="8" inputmode="decimal"><div id="tr-out"></div></details><div id="info-live"></div></aside>

  <footer id="bar">
    <div class="row">
      <button id="play" class="icon" aria-label="Pause">❚❚</button>
      <input id="speed" type="range" min="0" max="9" step="1" value="0" aria-label="Vitesse de simulation">
      <output id="speed-out">10 j/s</output>
      <output id="date" aria-label="Date de simulation"></output>
    </div>
    <details id="ephem"><summary>Éphémérides</summary>
      <div class="grid">
        <label>Horizon <select id="eph-h"><option value="30">30 jours</option><option value="365.25" selected>1 an</option><option value="1826">5 ans</option></select></label>
        <label>Corps <select id="eph-body"></select></label>
        <label><input type="checkbox" id="eph-ecl" checked> Éclipses de l'étoile</label>
        <label><input type="checkbox" id="eph-sun" checked> Lever / coucher (site choisi)</label>
        <label><input type="checkbox" id="eph-ali"> Alignements</label>
        <label><input type="checkbox" id="eph-aps"> Périhélies / aphélies</label>
        <button type="button" id="eph-go" class="wide">Calculer</button>
      </div>
      <div id="eph-note" class="note"></div><ol id="eph-list"></ol>
    </details>
    <details id="chrono"><summary>Chronologie · âge du système</summary><div id="chrono-body"></div></details>
    <details id="settings">
      <summary>Paramètres &amp; diagnostics</summary>
      <div class="grid">
        <label><input type="checkbox" id="t-orbits" checked> Orbites</label>
        <label><input type="checkbox" id="t-labels" checked> Noms</label>
        <label><input type="checkbox" id="t-belt" checked> Ceinture (Nunzir)</label>
        <label><input type="checkbox" id="t-edge" checked> Confins (35 UA)</label>
        <label><input type="checkbox" id="t-gr" checked> Relativité générale (1PN)</label>
        <label><input type="checkbox" id="t-trojans"> Troyens de Zirkan (ajout)</label>
        <label class="wide">Astéroïdes : <output id="n-out">4000</output>
          <input type="range" id="n-ast" min="500" max="20000" step="500" value="4000"></label>
        <div class="wide diag" id="diag"></div>
        <button id="reset" class="wide">Réinitialiser la simulation</button>
      </div>
    </details>
  </footer>

  <div id="loader"><div><b>Système d'Omraon</b><span id="loader-msg">Initialisation…</span></div></div>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
