# Preparation commune a toutes les portes qualite : PHP, cache Composer,
# dependances. Appelee par .github/workflows/qualite.yml.
name: Préparation PHP
description: Installe PHP et les dépendances Composer de app/.

inputs:
  php-version:
    description: >
      Branche PHP de la stack (ex. 8.5), pas le correctif. setup-php ne
      documente que le format major.minor pour php-version ; c'est
      "update" qui amene le dernier correctif de cette branche.
    required: false
    default: '8.5'

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        extensions: pdo_pgsql, intl, zip
        coverage: none
      env:
        # Sans "update", le runner garde le PHP pre-installe de l'image
        # GitHub, qui n'est pas au dernier correctif. La CI validait donc
        # le code sur un PHP plus ancien que celui de production — et un
        # changement de comportement introduit par un correctif ne
        # pouvait pas y etre vu (CERTFR-2026-ALE-014, 2026-10-21).
        update: true

    - name: Cache des dependances Composer
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: app/vendor
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('app/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

    # working-directory explicite : les defaults du workflow appelant ne
    # traversent pas une action composite.
    - name: Installation des dependances
      shell: bash
      working-directory: app
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-interaction
        else
          echo "Application pas encore installee — rien a verifier."
        fi
