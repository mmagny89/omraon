# Montées de version surveillées par Dependabot.
# Dépôt qui n'a que `main` : pas de target-branch (stack-ci-deploiement.md, §ci/dependabot).
# Dès qu'une `develop` existe, ajouter `target-branch: develop` sur CHAQUE entrée.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mises-a-jour-courantes:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/docker/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
