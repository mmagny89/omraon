name: omraon-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}

# Un seul service : Caddy sert app/ tel quel. read_only + no-new-privileges :
# le conteneur n'ecrit que dans ses deux volumes (certificats, configuration).
services:
  web:
    container_name: omraon-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-web
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: ${TARGET}
      args:
        CADDY_VERSION: ${CADDY_VERSION}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    image: omraon-web:${TARGET}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - omraon-caddy-data:/data
      - omraon-caddy-config:/config

volumes:
  omraon-caddy-data:
    name: omraon-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-caddy-data
  omraon-caddy-config:
    name: omraon-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-caddy-config
